<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Logout - Advisor CRM</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e40af;
            --gradient-primary: linear-gradient(135deg, #1e40af 0%, #059669 100%);
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .confirm-card {
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        
        .confirm-header {
            background: var(--gradient-primary);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .confirm-body {
            padding: 2rem;
            background: white;
            text-align: center;
        }
        
        .warning-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f59e0b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .btn-danger {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        
        .btn-outline-secondary {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="confirm-card">
        <div class="confirm-header">
            <h3 class="mb-0">Confirm Logout</h3>
        </div>
        
        <div class="confirm-body">
            <div class="warning-icon">
                <i class="bi bi-question-lg"></i>
            </div>
            
            <h4 class="mb-3">Are you sure you want to logout?</h4>
            <p class="text-muted mb-4">
                You will need to enter your credentials again to access the system.
            </p>
            
            <form method="post" action="/logout/">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>Yes, Logout
                    </button>
                    <a href="/dashboard/" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
